<text x="72" y="179" font-family="Georgia,serif" font-size="26" font-weight="700" fill="#2a1d14">Add pagination to reports API</text>
<text x="72" y="200" font-size="11" fill="#867462">● Medium priority  ·  Assigned to Junior Engineer  ·  2 days ago</text>

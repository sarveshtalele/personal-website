  <text x="98" y="286" text-anchor="middle" font-size="10" fill="#8b6b40">1</text>
  <text x="120" y="279" font-weight="650">Read the existing reports route</text>
  <text x="120" y="294" font-size="9" fill="#9a8772">Trace filters, query params and data flow</text>
  <path d="M88 309 H408" stroke="#f0e7d9"/>

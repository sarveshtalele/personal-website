  <text x="606" y="322" text-anchor="middle" font-size="10" fill="#8f7a62">Delegate one implementation step.</text>
  <text x="606" y="338" text-anchor="middle" font-size="10" fill="#8f7a62">You stay responsible for the result.</text>
  <g font-size="9" text-anchor="middle" fill="#806747">

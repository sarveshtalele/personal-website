<text class="button-label sent" x="306" y="448" font-size="9.5" font-weight="700" fill="#fffaf2">Delegated</text>
<text x="89" y="478" font-size="9" fill="#9a8772">You can ask for help at any step.</text>
<rect x="440" y="148" width="333" height="344" rx="13" fill="#fbf7ef" stroke="#cbb593"/>
<path d="M440 161 Q440 148 453 148 H760 Q773 148 773 161 V187 H440 Z" fill="#f3e9d7"/>

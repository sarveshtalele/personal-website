<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="motion-title motion-desc">
<title id="motion-title">The AI engineering apprenticeship gap</title>
<desc id="motion-desc">A junior engineer works on an API task, delegates implementation to an AI agent, and sees the pull request pass tests. The practice step on the engineering career ladder is then highlighted as a potential gap, followed by the question: where will tomorrow's senior engineers come from?</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241b14"/><stop offset="1" stop-color="#14100c"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6a33"/><stop offset=".5" stop-color="#e3c58c"/><stop offset="1" stop-color="#8a6a33"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".32"/></filter>
  <style>
    *{box-sizing:border-box}
    text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
    .label{font-size:11px;font-weight:700;letter-spacing:2px;fill:#a67c3d}
    .main{font-family:Georgia,serif;fill:#f2e8d8}
    .agent-step{opacity:0;transform:translateX(10px)}
    .standby{opacity:1}
    .progress-fill{transform-origin:left;transform:scaleX(0)}
    .pr-card{opacity:0;transform:translateY(8px)}
    .cursor{opacity:0;transform:translate(0,0)}
    .question-shade{opacity:0}
    .question-card{opacity:0;transform:translateY(14px)}
    .gap-note{opacity:0;transform:translateY(6px)}
    .practice-node{fill:#a67c3d}
    .practice-label{fill:#453223}
    .task-check{fill:#fbf7ef;stroke:#d5c2a4}
    .delegate{fill:#6b4226}
    .standby{animation:standbyOut 12s linear infinite}
    .agent-step.one{animation:stepOne 12s linear infinite}
    .agent-step.two{animation:stepTwo 12s linear infinite}
    .agent-step.three{animation:stepThree 12s linear infinite}
    .progress-fill{animation:progress 12s linear infinite}
    .pr-card{animation:pr 12s linear infinite}
    .task-check.one{animation:checkOne 12s linear infinite}
    .task-check.two{animation:checkTwo 12s linear infinite}
    .task-check.three{animation:checkThree 12s linear infinite}
    .delegate{animation:buttonState 12s linear infinite}
    .button-label.default{animation:defaultLabel 12s steps(1,end) infinite}
    .button-label.sent{opacity:0;animation:sentLabel 12s steps(1,end) infinite}
    .practice-node{animation:practiceNode 12s linear infinite}
    .practice-label{animation:practiceText 12s linear infinite}
    .gap-note{animation:gap 12s linear infinite}
    .question-shade{animation:shade 12s linear infinite}
    .question-card{animation:question 12s linear infinite}
    .cursor{animation:cursor 12s cubic-bezier(.45,0,.1,1) infinite}
    .reset{animation:reset 12s linear infinite}
    @keyframes standbyOut{0%,17%{opacity:1}22%,89%{opacity:0}96%,100%{opacity:1}}
    @keyframes stepOne{0%,20%{opacity:0;transform:translateX(10px)}25%,88%{opacity:1;transform:translateX(0)}92%,100%{opacity:0;transform:translateX(10px)}}
    @keyframes stepTwo{0%,27%{opacity:0;transform:translateX(10px)}32%,88%{opacity:1;transform:translateX(0)}92%,100%{opacity:0;transform:translateX(10px)}}
    @keyframes stepThree{0%,34%{opacity:0;transform:translateX(10px)}39%,88%{opacity:1;transform:translateX(0)}92%,100%{opacity:0;transform:translateX(10px)}}
    @keyframes progress{0%,20%{transform:scaleX(0)}43%{transform:scaleX(.48)}56%,88%{transform:scaleX(1)}92%,100%{transform:scaleX(0)}}
    @keyframes pr{0%,43%{opacity:0;transform:translateY(8px)}49%,88%{opacity:1;transform:translateY(0)}92%,100%{opacity:0;transform:translateY(8px)}}
    @keyframes checkOne{0%,17%{fill:#fbf7ef;stroke:#d5c2a4}23%,88%{fill:#e8eee1;stroke:#b9c9ab}92%,100%{fill:#fbf7ef;stroke:#d5c2a4}}
    @keyframes checkTwo{0%,26%{fill:#fbf7ef;stroke:#d5c2a4}32%,88%{fill:#e8eee1;stroke:#b9c9ab}92%,100%{fill:#fbf7ef;stroke:#d5c2a4}}
    @keyframes checkThree{0%,33%{fill:#fbf7ef;stroke:#d5c2a4}39%,88%{fill:#e8eee1;stroke:#5b7652}92%,100%{fill:#fbf7ef;stroke:#d5c2a4}}
    @keyframes buttonState{0%,16%{fill:#6b4226}18%,23%{fill:#8d6a3b}26%,88%{fill:#5b7652}92%,100%{fill:#6b4226}}
    @keyframes defaultLabel{0%,23%{opacity:1}24%,88%{opacity:0}92%,100%{opacity:1}}
    @keyframes sentLabel{0%,23%{opacity:0}24%,88%{opacity:1}92%,100%{opacity:0}}
    @keyframes practiceNode{0%,51%{fill:#a67c3d;stroke:#c8ad7e}57%,88%{fill:#fbf7ef;stroke:#c29c5e}92%,100%{fill:#a67c3d;stroke:#c8ad7e}}
    @keyframes practiceText{0%,51%{fill:#453223}57%,88%{fill:#9b7848}92%,100%{fill:#453223}}
    @keyframes gap{0%,55%{opacity:0;transform:translateY(6px)}61%,88%{opacity:1;transform:translateY(0)}92%,100%{opacity:0;transform:translateY(6px)}}
    @keyframes shade{0%,64%{opacity:0}70%,88%{opacity:.42}92%,100%{opacity:0}}
    @keyframes question{0%,64%{opacity:0;transform:translateY(14px)}70%,88%{opacity:1;transform:translateY(0)}92%,100%{opacity:0;transform:translateY(14px)}}
    @keyframes cursor{0%,7%{opacity:0;transform:translate(245px,438px)}10%{opacity:1;transform:translate(245px,438px)}17%{opacity:1;transform:translate(356px,414px)}19%{opacity:1;transform:translate(356px,414px) scale(.82)}21%,26%{opacity:0;transform:translate(356px,414px)}100%{opacity:0;transform:translate(356px,414px)}}
    @keyframes reset{0%,90%{opacity:0}92%,96%{opacity:1}99%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){
      .standby,.agent-step,.progress-fill,.pr-card,.task-check,.delegate,.button-label.default,.button-label.sent,.practice-node,.practice-label,.gap-note,.question-shade,.question-card,.cursor,.reset{animation:none!important}
      .standby{display:none}
      .agent-step,.pr-card{opacity:1;transform:none}
      .progress-fill{transform:scaleX(1)}
      .task-check{fill:#e8eee1;stroke:#b9c9ab}
      .delegate{fill:#5b7652}
      .button-label.default{opacity:0}
      .button-label.sent{opacity:1}
      .practice-node{fill:#fbf7ef;stroke:#c29c5e}
      .practice-label{fill:#9b7848}
      .gap-note{opacity:1;transform:none}
      .question-shade{display:none}
      .question-card{display:block;opacity:1;transform:none}
      .cursor,.reset{display:none}
    }
  </style>
</defs>

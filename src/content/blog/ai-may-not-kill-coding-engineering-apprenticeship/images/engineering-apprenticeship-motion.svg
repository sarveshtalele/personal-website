  <text x="98" y="337" text-anchor="middle" font-size="10" fill="#8b6b40">2</text>
  <text x="120" y="330" font-weight="650">Implement cursor pagination</text>
  <text x="120" y="345" font-size="9" fill="#9a8772">Handle limits, next cursor and boundaries</text>
  <path d="M88 360 H408" stroke="#f0e7d9"/>
  <circle class="task-check three" cx="98" cy="384" r="11" stroke-width="1"/>
  <text x="98" y="388" text-anchor="middle" font-size="10" fill="#8b6b40">3</text>
  <text x="120" y="381" font-weight="650">Test and debug edge cases</text>
  <text x="120" y="396" font-size="9" fill="#9a8772">Empty pages, invalid cursors and ordering</text>
</g>
<circle cx="101" cy="438" r="13" fill="#6b4226"/>
<text x="101" y="442" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="700" fill="#fffaf2">J</text>

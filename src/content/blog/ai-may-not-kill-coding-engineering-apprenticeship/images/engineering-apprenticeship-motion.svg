<rect x="119" y="82" width="19" height="19" rx="5" fill="#6b4226"/>
<text x="128.5" y="95.5" font-size="10" font-weight="700" text-anchor="middle" fill="#fffaf2">N</text>
<text x="149" y="96" font-size="12" font-weight="650" fill="#f2e8d8">northstar <tspan fill="#80674d">/</tspan> reports-api <tspan fill="#80674d">/</tspan> issue #248</text>
<rect x="1004" y="80" width="128" height="22" rx="11" fill="#30251a" stroke="#574230"/>
<text x="1068" y="95" text-anchor="middle" font-size="9" font-weight="700" fill="#d9b77e">● MAIN · CLEAN</text>

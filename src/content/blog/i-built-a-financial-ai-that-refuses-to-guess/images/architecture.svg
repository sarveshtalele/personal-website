<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t2">
  <title id="t2">Architecture: user conversation goes to the language model, which calls tools over MCP; the Meta Advisor orchestrates 76 deterministic calculators and live market data; results flow back to the model, which explains them.</title>
  <rect width="1200" height="560" rx="28" fill="#f6f0e4"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b4226"/></marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="220" width="190" height="120" rx="20" fill="#fffaf2" stroke="#cbb593" stroke-width="2"/>
    <text x="135" y="272" font-size="22" font-weight="700" fill="#2a1d14">You</text>
    <text x="135" y="302" font-size="16" fill="#5c4838">a story, in plain words</text>

    <rect x="300" y="220" width="210" height="120" rx="20" fill="#6b4226"/>
    <text x="405" y="272" font-size="22" font-weight="700" fill="#fffaf2">Language model</text>
    <text x="405" y="302" font-size="16" fill="#f0e3d1">intent · context · goals</text>

    <rect x="580" y="230" width="120" height="100" rx="50" fill="#241b14"/>
    <text x="640" y="288" font-size="22" font-weight="700" letter-spacing="4" fill="#e3c58c">MCP</text>

    <rect x="770" y="60" width="390" height="150" rx="20" fill="#fffaf2" stroke="#a67c3d" stroke-width="2"/>
    <text x="965" y="112" font-size="22" font-weight="700" fill="#2a1d14">Meta Advisor</text>
    <text x="965" y="144" font-size="16" fill="#5c4838">which tools, in what order,</text>
    <text x="965" y="168" font-size="16" fill="#5c4838">and how outputs feed the next step</text>

    <rect x="770" y="250" width="390" height="120" rx="20" fill="#efe5d3" stroke="#cbb593" stroke-width="2"/>
    <text x="965" y="300" font-size="22" font-weight="700" fill="#2a1d14">76 deterministic calculators</text>
    <text x="965" y="330" font-size="16" fill="#5c4838">13 domains · same input → same output</text>

    <rect x="770" y="410" width="390" height="100" rx="20" fill="#efe5d3" stroke="#cbb593" stroke-width="2"/>
    <text x="965" y="455" font-size="22" font-weight="700" fill="#2a1d14">Live market data</text>
    <text x="965" y="483" font-size="16" fill="#5c4838">mutual fund NAVs · equities · FX</text>
  </g>
  <g stroke="#6b4226" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M230 280 H 294"/>
    <path d="M510 280 H 574"/>
    <path d="M700 270 C 730 200, 740 140, 764 136"/>
    <path d="M700 285 H 764"/>
    <path d="M700 300 C 730 380, 740 455, 764 458"/>
  </g>
  <path d="M770 540 C 600 560, 420 540, 405 346" fill="none" stroke="#a67c3d" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a)"/>
  <text x="560" y="520" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#6b4226" text-anchor="middle">numbers come back, the model explains them</text>
</svg>

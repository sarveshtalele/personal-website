<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">The apprenticeship bridge in software engineering</title><desc id="desc">A junior engineer learns with a mentor and gradually crosses a bridge into AI-assisted system ownership, review and reliability.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15110D"/><stop offset="1" stop-color="#263D36"/></linearGradient><linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#896034"/><stop offset="1" stop-color="#E2BD83"/></linearGradient></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/>
<circle cx="1120" cy="180" r="210" fill="#C99A5B" opacity=".09"/>
<text x="70" y="80" fill="#C99A5B" font-family="Arial,sans-serif" font-size="20" letter-spacing="5">THE CAREER LADDER NEEDS A BRIDGE</text>
<path d="M110 570C380 510 600 470 810 410S1120 280 1290 220" fill="none" stroke="url(#bridge)" stroke-width="34" stroke-linecap="round"/>
<path d="M110 532C390 470 600 430 810 370S1120 240 1290 180" fill="none" stroke="#E2BD83" stroke-width="6" stroke-linecap="round"/>
<path d="M110 608C390 548 600 510 810 450S1120 320 1290 260" fill="none" stroke="#76522D" stroke-width="7" stroke-dasharray="10 18"/>
<g stroke="#B9884E" stroke-width="5" fill="#211912">
 <path d="M250 520v105M470 480v105M700 435v105M920 365v105M1140 285v105"/>
 <path d="M250 520l-35-30M250 520l35-30M470 480l-35-30M470 480l35-30M700 435l-35-30M700 435l35-30M920 365l-35-30M920 365l35-30M1140 285l-35-30M1140 285l35-30"/>
</g>
<g font-family="Arial,sans-serif">
 <g transform="translate(140 260)"><circle cx="60" cy="40" r="33" fill="#D9B77E"/><path d="M18 165q10-82 42-82t42 82" fill="#8B6844" stroke="#D9B77E" stroke-width="5"/><rect x="5" y="160" width="110" height="65" rx="12" fill="#2D251D" stroke="#C99A5B" stroke-width="3"/><path d="M25 180h70M25 198h50" stroke="#D9B77E" stroke-width="4"/><text x="60" y="260" text-anchor="middle" font-size="22" fill="#F2E8D8" font-weight="700">Learn the basics</text><text x="60" y="290" text-anchor="middle" font-size="16" fill="#A08D75">Build · debug · ask</text></g>
 <g transform="translate(440 185)"><circle cx="60" cy="40" r="33" fill="#D9B77E"/><path d="M18 165q10-82 42-82t42 82" fill="#41665A" stroke="#9DC5AB" stroke-width="5"/><rect x="5" y="160" width="110" height="65" rx="12" fill="#203A31" stroke="#79B69B" stroke-width="3"/><path d="M25 180h70M25 198h50" stroke="#9DC5AB" stroke-width="4"/><text x="60" y="260" text-anchor="middle" font-size="22" fill="#F2E8D8" font-weight="700">Work with a mentor</text><text x="60" y="290" text-anchor="middle" font-size="16" fill="#A08D75">Reviews · feedback</text></g>
 <g transform="translate(760 105)"><circle cx="60" cy="40" r="33" fill="#D9B77E"/><path d="M18 165q10-82 42-82t42 82" fill="#41665A" stroke="#9DC5AB" stroke-width="5"/><rect x="5" y="160" width="110" height="65" rx="12" fill="#203A31" stroke="#79B69B" stroke-width="3"/><path d="M25 180h70M25 198h50" stroke="#9DC5AB" stroke-width="4"/><text x="60" y="260" text-anchor="middle" font-size="22" fill="#F2E8D8" font-weight="700">Direct AI agents</text><text x="60" y="290" text-anchor="middle" font-size="16" fill="#A08D75">Evaluate · verify</text></g>
 <g transform="translate(1080 40)"><circle cx="60" cy="40" r="33" fill="#D9B77E"/><path d="M18 165q10-82 42-82t42 82" fill="#41665A" stroke="#9DC5AB" stroke-width="5"/><rect x="5" y="160" width="110" height="65" rx="12" fill="#203A31" stroke="#79B69B" stroke-width="3"/><path d="M25 180h70M25 198h50" stroke="#9DC5AB" stroke-width="4"/><text x="60" y="260" text-anchor="middle" font-size="22" fill="#F2E8D8" font-weight="700">Own systems</text><text x="60" y="290" text-anchor="middle" font-size="16" fill="#A08D75">Reliability · judgment</text></g>
</g>
<text x="70" y="690" fill="#CDBBA2" font-family="Georgia,serif" font-size="25">If we remove the first steps, we must deliberately create new ones.</text>
</svg>
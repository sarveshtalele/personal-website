<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">From human computers to AI coding agents</title><desc id="desc">Four illustrated eras show people calculating by hand, programming with punched cards and compilers, using spreadsheets, and directing AI agents.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17120E"/><stop offset="1" stop-color="#292018"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#76522D"/><stop offset=".5" stop-color="#E3BD82"/><stop offset="1" stop-color="#C99A5B"/></linearGradient></defs>
<rect width="1400" height="720" rx="28" fill="url(#bg)"/>
<text x="70" y="82" fill="#C99A5B" font-family="Arial,sans-serif" font-size="20" letter-spacing="5">THE WORK KEEPS CHANGING</text>
<path d="M135 330H1265" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <g transform="translate(180 320)"><circle r="104" fill="#211912" stroke="#C99A5B" stroke-width="3"/><path d="M-52 33v-55q0-40 40-40h24q38 0 38 40v55M-52 6h104M-35 38h70" fill="none" stroke="#D9B77E" stroke-width="9" stroke-linecap="round"/><circle cy="-68" r="19" fill="#D9B77E"/><path d="M-80 55h160" stroke="#D9B77E" stroke-width="7"/><text y="160" fill="#F2E8D8" font-size="24" font-weight="700">People calculate</text><text y="194" fill="#A08D75" font-size="18">Human computers</text><text y="226" fill="#A08D75" font-size="16">Tables · ledgers · slide rules</text></g>
 <g transform="translate(525 320)"><circle r="104" fill="#211912" stroke="#C99A5B" stroke-width="3"/><rect x="-56" y="-65" width="112" height="130" rx="10" fill="#302419" stroke="#D9B77E" stroke-width="4"/><g fill="#D9B77E"><circle cx="-28" cy="-35" r="6"/><circle cx="0" cy="-35" r="6"/><circle cx="28" cy="-35" r="6"/><circle cx="-28" cy="0" r="6"/><circle cx="0" cy="0" r="6"/><circle cx="28" cy="0" r="6"/><circle cx="-28" cy="35" r="6"/><circle cx="0" cy="35" r="6"/><circle cx="28" cy="35" r="6"/></g><text y="160" fill="#F2E8D8" font-size="24" font-weight="700">Machines translate</text><text y="194" fill="#A08D75" font-size="18">Languages · compilers</text><text y="226" fill="#A08D75" font-size="16">FORTRAN · abstraction</text></g>
 <g transform="translate(875 320)"><circle r="104" fill="#211912" stroke="#C99A5B" stroke-width="3"/><rect x="-70" y="-58" width="140" height="116" rx="9" fill="#21392D" stroke="#9AC3A5" stroke-width="4"/><g stroke="#9AC3A5" stroke-width="3"><path d="M-45 -32H45M-45 -5H45M-45 22H45M-15 -40V40M15 -40V40"/></g><circle cx="45" cy="22" r="8" fill="#C99A5B"/><text y="160" fill="#F2E8D8" font-size="24" font-weight="700">Numbers recalculate</text><text y="194" fill="#A08D75" font-size="18">Spreadsheets · software</text><text y="226" fill="#A08D75" font-size="16">Analysis replaces repetition</text></g>
 <g transform="translate(1220 320)"><circle r="104" fill="#211912" stroke="#C99A5B" stroke-width="3"/><rect x="-66" y="-60" width="132" height="120" rx="18" fill="#1D3934" stroke="#70C7B2" stroke-width="4"/><circle r="28" fill="#75D8BD"/><path d="M-42 -40l-17-17M42 -40l17-17M-42 40l-17 17M42 40l17 17" stroke="#70C7B2" stroke-width="5" stroke-linecap="round"/><circle cx="-9" cy="-3" r="5" fill="#173028"/><circle cx="9" cy="-3" r="5" fill="#173028"/><path d="M-11 11q11 11 22 0" fill="none" stroke="#173028" stroke-width="4" stroke-linecap="round"/><text y="160" fill="#F2E8D8" font-size="24" font-weight="700">People direct agents</text><text y="194" fill="#A08D75" font-size="18">AI-assisted engineering</text><text y="226" fill="#A08D75" font-size="16">Judgment · review · ownership</text></g>
</g>
<text x="70" y="670" fill="#CDBBA2" font-family="Georgia,serif" font-size="24">Every new layer changes what people spend their time doing.</text>
</svg>
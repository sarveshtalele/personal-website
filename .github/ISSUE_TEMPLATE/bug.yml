name: Bug report
description: Something on the site looks or behaves wrong
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://sarveshtalele.org/...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / browser
      placeholder: iPhone 15, Safari 18
